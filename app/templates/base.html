<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>TradeJournal Lite</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <style>
            body { background-color: #f8f9fa }
            .main-container { max-width: 800px; margin-top: 50px;}
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
            <div class="container">
                
                <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
                    TradeJournal 📈
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    
                    {% if current_user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link active" href="{{ url_for('index') }}">Dashboard</a>
                        </li>
                        <li class="nav-item ms-3">
                            <span class="navbar-text text-white-50">
                                Olá, {{ current_user.username }}
                            </span>
                        </li>
                        <li class="nav-item ms-3">
                            <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Sair</a>
                        </li>

                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('login') }}">Entrar</a>
                        </li>
                        <li class="nav-item ms-3">
                            <a class="btn btn-light text-primary fw-bold btn-sm" href="{{ url_for('register') }}">Criar Conta Grátis</a>
                        </li>
                    {% endif %}

                </ul>
                </div>
            </div>
        </nav>
        <div class="container main-container">
            {% block content %}{% endblock %}
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
