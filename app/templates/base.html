<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>TradeJournal Lite</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <style>
            body { background-color: #f8f9fa }
            .main-container { max-width: 800px; margin-top: 50px;}
        </style>
    </head>
    <body>
        <nav class="navbar navbar-dark bg-primary mb-4">
            <div class="container">
                <a href="{{ url_for('index') }}" class="navbar-brand mb-0 h1">📈 TradeJournal Lite</a>
            
                <div>
                    {% if current_user.is_authenticated %}
                        <span class="text-white me-3">Olá, {{ current_user.username }}</span>
                        <a href="{{ url_for('logout') }}" class="btn btn-sm btn-light">Sair</a>
                    {% else %}
                        <a href="{{ url_for('login') }}" class="btn btn-sm btn-outline-light">Login</a>
                    {% endif %}
                </div>
            </div>
        </nav>
        <div class="container main-container">
            {% block content %}{% endblock %}
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
