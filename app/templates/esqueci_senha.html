{% extends "base.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
        <h3 class="text-center mb-3">Recuperar Senha</h3>
        <p class="text-muted text-center small mb-4">Informe seu e-mail cadastrado para receber o código de verificação.</p>

        <form method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="seu@email.com">
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar Código</button>
        </form>
        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="text-decoration-none small text-muted">Voltar para Login</a>
        </div>
    </div>
</div>

{% endblock %}
